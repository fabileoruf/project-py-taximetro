services:
  app:
    build: .
    ports:
      - "${TAXIMETRO_BIND:-127.0.0.1}:${TAXIMETRO_PORT:-8080}:8080"
    volumes:
      - taxi-data:/data
      - ./config.json:/app/config.json:ro
    environment:
      TAXIMETRO_HTTPS: ${TAXIMETRO_HTTPS:-0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  taxi-data:
